<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
    role="img"
    aria-label="Side view of a slotted flathead screw with head, neck, shaft and tip dimensioned">
    <title>Slotted flathead screw, labelled regions</title>

    <defs>
        <clipPath id="shank">
            <path d="M280,125 H640 L680,150 L640,175 H280 Z" />
        </clipPath>
        <marker id="dimStart" viewBox="0 0 10 10" refX="0" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
            <path d="M10,0 L0,5 L10,10 Z" fill="#000000" />
        </marker>
        <marker id="dimEnd" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000000" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- part fill -->
    <path d="M50,100 L80,125 H640 L680,150 L640,175 H80 L50,200 L50,160 L65,160 L65,140 L50,140 Z"
        fill="#ffffff" />

    <!-- threads, clipped to the shank -->
    <g clip-path="url(#shank)" stroke="#000000" stroke-width="1.8" stroke-linecap="round">
        <line x1="280" y1="175" x2="316" y2="125" />
        <line x1="306" y1="175" x2="342" y2="125" />
        <line x1="332" y1="175" x2="368" y2="125" />
        <line x1="358" y1="175" x2="394" y2="125" />
        <line x1="384" y1="175" x2="420" y2="125" />
        <line x1="410" y1="175" x2="446" y2="125" />
        <line x1="436" y1="175" x2="472" y2="125" />
        <line x1="462" y1="175" x2="498" y2="125" />
        <line x1="488" y1="175" x2="524" y2="125" />
        <line x1="514" y1="175" x2="550" y2="125" />
        <line x1="540" y1="175" x2="576" y2="125" />
        <line x1="566" y1="175" x2="602" y2="125" />
        <line x1="592" y1="175" x2="628" y2="125" />
        <line x1="618" y1="175" x2="654" y2="125" />
        <line x1="644" y1="175" x2="680" y2="125" />
        <line x1="670" y1="175" x2="706" y2="125" />
    </g>

    <!-- outline -->
    <path d="M50,100 L80,125 H640 L680,150 L640,175 H80 L50,200 L50,160 L65,160 L65,140 L50,140 Z"
        fill="none" stroke="#000000" stroke-width="2.5" stroke-linejoin="round" />

    <!-- extension lines at each region boundary -->
    <g stroke="#000000" stroke-width="1">
        <line x1="50" y1="205" x2="50" y2="258" />
        <line x1="80" y1="205" x2="80" y2="258" />
        <line x1="280" y1="205" x2="280" y2="258" />
        <line x1="640" y1="205" x2="640" y2="258" />
        <line x1="680" y1="205" x2="680" y2="258" />
    </g>

    <!-- dimension lines with outward arrows -->
    <g stroke="#000000" stroke-width="1.4"
        marker-start="url(#dimStart)" marker-end="url(#dimEnd)">
        <line x1="50" y1="250" x2="80" y2="250" />
        <line x1="80" y1="250" x2="280" y2="250" />
        <line x1="280" y1="250" x2="640" y2="250" />
        <line x1="640" y1="250" x2="680" y2="250" />
    </g>

    <!-- region labels -->
    <g fill="#000000" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="16" text-anchor="middle">
        <text x="65" y="284">Head</text>
        <text x="180" y="284">Neck</text>
        <text x="460" y="284">Shaft</text>
        <text x="660" y="284">Tip</text>
    </g>
</svg>
