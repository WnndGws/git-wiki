<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700"
    role="img"
    aria-label="Two rib schematics: locking ribs that bite the hole wall, and countersink-clearing ribs that shave the seat">
    <title>Two rib functions: locking and countersink-clearing</title>

    <defs>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000" />
        </marker>
        <clipPath id="shankA">
            <rect x="332" y="360" width="36" height="140" />
        </clipPath>
        <clipPath id="shankB">
            <rect x="1023" y="330" width="54" height="190" />
        </clipPath>
        <clipPath id="det">
            <circle cx="800" cy="150" r="50" />
        </clipPath>
    </defs>

    <style>
    .ttl  { font-family:"DejaVu Sans",Helvetica,Arial,sans-serif; font-size:15px; font-weight:bold; fill:#000; text-anchor:middle; }
    .cap  { font-family:"DejaVu Sans",Helvetica,Arial,sans-serif; font-size:12px; fill:#000; text-anchor:middle; }
    .sm   { font-family:"DejaVu Sans",Helvetica,Arial,sans-serif; font-size:11px; fill:#000; }
    .out  { fill:#fff; stroke:#000; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; }
    .outn { fill:none; stroke:#000; stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; }
    .thin { fill:none; stroke:#000; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
    .thr  { fill:none; stroke:#000; stroke-width:1.6; stroke-linecap:round; }
    .dash { fill:none; stroke:#000; stroke-width:1; stroke-dasharray:5 4; }
    .pane { fill:none; stroke:#bbb; stroke-width:1; }
  </style>

    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- ===================== PANEL 1: LOCKING RIBS ===================== -->
    <rect class="pane" x="20" y="60" width="660" height="580" />
    <text class="ttl" x="350" y="92">1. Locking ribs</text>
    <text class="cap" x="350" y="112">Splines bite the hole wall, so the fastener resists turning</text>

    <rect class="out" x="140" y="220" width="182" height="160" />
    <rect class="out" x="378" y="220" width="182" height="160" />
    <text class="sm" x="231" y="305" text-anchor="middle">plate</text>
    <text class="sm" x="469" y="305" text-anchor="middle">plate</text>

    <rect class="out" x="305" y="150" width="90" height="45" />
    <text class="sm" x="350" y="178" text-anchor="middle">head</text>

    <rect class="out" x="322" y="195" width="56" height="165" />
    <g class="thin">
        <line x1="336" y1="195" x2="336" y2="360" />
        <line x1="350" y1="195" x2="350" y2="360" />
        <line x1="364" y1="195" x2="364" y2="360" />
    </g>

    <path class="thin"
        d="M322,220 L316,230 L322,240 L316,250 L322,260 L316,270 L322,280 L316,290 L322,300 L316,310 L322,320 L316,330 L322,340 L316,350 L322,360" />
    <path class="thin"
        d="M378,220 L384,230 L378,240 L384,250 L378,260 L384,270 L378,280 L384,290 L378,300 L384,310 L378,320 L384,330 L378,340 L384,350 L378,360" />

    <path class="out" d="M332,360 H368 V500 L350,540 L332,500 Z" />
    <g clip-path="url(#shankA)" class="thr">
        <line x1="328" y1="380" x2="372" y2="360" />
        <line x1="328" y1="400" x2="372" y2="380" />
        <line x1="328" y1="420" x2="372" y2="400" />
        <line x1="328" y1="440" x2="372" y2="420" />
        <line x1="328" y1="460" x2="372" y2="440" />
        <line x1="328" y1="480" x2="372" y2="460" />
        <line x1="328" y1="500" x2="372" y2="480" />
    </g>

    <line class="dash" x1="300" y1="280" x2="400" y2="280" />
    <text class="sm" x="296" y="276" text-anchor="end">A</text>
    <text class="sm" x="404" y="276" text-anchor="start">A</text>

    <line class="dash" x1="384" y1="262" x2="424" y2="256" />
    <text class="sm" x="428" y="260" text-anchor="start">splines bite the wall</text>

    <circle class="outn" cx="560" cy="480" r="52" />
    <circle class="thin" cx="560" cy="480" r="42" />
    <g stroke="#000" stroke-width="6" stroke-linecap="round">
        <line x1="602" y1="480" x2="612" y2="480" />
        <line x1="589.7" y1="509.7" x2="596.8" y2="516.8" />
        <line x1="560" y1="522" x2="560" y2="532" />
        <line x1="530.3" y1="509.7" x2="523.2" y2="516.8" />
        <line x1="518" y1="480" x2="508" y2="480" />
        <line x1="530.3" y1="450.3" x2="523.2" y2="443.2" />
        <line x1="560" y1="438" x2="560" y2="428" />
        <line x1="589.7" y1="450.3" x2="596.8" y2="443.2" />
    </g>
    <text class="sm" x="560" y="552" text-anchor="middle">A-A</text>

    <!-- ===================== PANEL 2: COUNTERSINK-CLEARING RIBS ===================== -->
    <rect class="pane" x="720" y="60" width="660" height="580" />
    <text class="ttl" x="1050" y="92">2. Countersink-clearing ribs</text>
    <text class="cap" x="1050" y="112">Ribs shave the seat so the head sinks flush</text>

    <rect class="out" x="780" y="270" width="540" height="300" />
    <polygon class="out" points="980,270 1023,340 1023,570 1077,570 1077,340 1120,270" />

    <path class="out" d="M968,240 H1132 L1077,330 V520 L1050,560 L1023,520 V330 Z" />
    <g clip-path="url(#shankB)" class="thr">
        <line x1="1019" y1="354" x2="1081" y2="330" />
        <line x1="1019" y1="378" x2="1081" y2="354" />
        <line x1="1019" y1="402" x2="1081" y2="378" />
        <line x1="1019" y1="426" x2="1081" y2="402" />
        <line x1="1019" y1="450" x2="1081" y2="426" />
        <line x1="1019" y1="474" x2="1081" y2="450" />
        <line x1="1019" y1="498" x2="1081" y2="474" />
        <line x1="1019" y1="522" x2="1081" y2="498" />
    </g>

    <path class="thin"
        d="M968,240 L981.75,262.5 L976.6,265.6 L995.5,285 L990.4,288.1 L1009.25,307.5 L1004.15,310.6 L1023,330" />
    <path class="thin"
        d="M1132,240 L1118.25,262.5 L1123.35,265.6 L1104.5,285 L1109.6,288.1 L1090.75,307.5 L1095.85,310.6 L1077,330" />

    <path d="M986,288 C976,284 970,272 968,262 C978,270 984,280 990,286 Z" fill="#000" />
    <path d="M1114,288 C1124,284 1130,272 1132,262 C1122,270 1116,280 1110,286 Z" fill="#000" />

    <path class="thin" d="M975,195 A90,52 0 0 1 1125,195" marker-end="url(#arw)" />

    <line class="dash" x1="972" y1="246" x2="936" y2="226" />
    <text class="sm" x="932" y="222" text-anchor="end">head</text>

    <line class="dash" x1="1119" y1="264" x2="1176" y2="230" />
    <text class="sm" x="1180" y="226" text-anchor="start">ribs</text>

    <line class="dash" x1="1120" y1="272" x2="1230" y2="300" />
    <text class="sm" x="1234" y="304" text-anchor="start">countersink</text>

    <text class="sm" x="800" y="545" text-anchor="start">wood</text>

    <circle class="outn" cx="800" cy="150" r="50" />
    <g clip-path="url(#det)">
        <line x1="750" y1="160" x2="850" y2="160" stroke="#000" stroke-width="1.6" />
        <polygon points="788,128 812,128 800,182" fill="#000" />
        <path d="M802,180 C812,176 818,164 820,154 C812,164 806,172 798,178 Z" fill="#000" />
    </g>
    <line class="dash" x1="848" y1="170" x2="974" y2="262" />
    <text class="sm" x="800" y="218" text-anchor="middle">rib (enlarged)</text>
</svg>
