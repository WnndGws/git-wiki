<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320"
    role="img"
    aria-label="Top view of seven screw head drives: Phillips, Pozidriv, Torx, square, slotted, hex socket and hex, each dimensioned with diameter D">
    <title>Screw head drives, top view</title>

    <defs>
        <marker id="dimStart" viewBox="0 0 10 10" refX="0" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
            <path d="M10,0 L0,5 L10,10 Z" fill="#000000" />
        </marker>
        <marker id="dimEnd" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="9" markerHeight="9" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#000000" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- ============ round head outlines ============ -->
    <g fill="#ffffff" stroke="#000000" stroke-width="2.5">
        <circle cx="100" cy="150" r="70" />
        <circle cx="280" cy="150" r="70" />
        <circle cx="460" cy="150" r="70" />
        <circle cx="640" cy="150" r="70" />
        <circle cx="820" cy="150" r="70" />
        <circle cx="1000" cy="150" r="70" />
    </g>

    <!-- ============ hexagonal head outline ============ -->
    <polygon points="1250,150 1215,89.4 1145,89.4 1110,150 1145,210.6 1215,210.6"
        fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter" />

    <!-- ============ 1. Phillips (non-tapered cross) ============ -->
    <path
        d="M89,98 L111,98 L111,139 L152,139 L152,161 L111,161 L111,202
           L89,202 L89,161 L48,161 L48,139 L89,139 Z"
        fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="miter" />

    <!-- ============ 2. Pozidriv (non-tapered cross + 4 ribs) ============ -->
    <path
        d="M269,98 L291,98 L291,139 L332,139 L332,161 L291,161 L291,202
           L269,202 L269,161 L228,161 L228,139 L269,139 Z"
        fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="miter" />
    <g stroke="#000000" stroke-width="5" stroke-linecap="round">
        <line x1="295" y1="135" x2="317" y2="113" />
        <line x1="265" y1="135" x2="243" y2="113" />
        <line x1="265" y1="165" x2="243" y2="187" />
        <line x1="295" y1="165" x2="317" y2="187" />
    </g>

    <!-- ============ 3. Torx (6 lobes) ============ -->
    <polygon
        points="460,104 443,120.56 420.16,127 426,150 420.16,173
                   443,179.44 460,196 477,179.44 499.84,173 494,150
                   499.84,127 477,120.56"
        fill="none" stroke="#000000" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round" />

    <!-- ============ 4. Square (Robertson) ============ -->
    <g fill="none" stroke="#000000" stroke-linejoin="round">
        <rect x="614" y="124" width="52" height="52" stroke-width="2.2" />
        <rect x="618" y="128" width="44" height="44" stroke-width="1.3" />
    </g>

    <!-- ============ 5. Slotted ============ -->
    <rect x="765" y="144" width="110" height="12" rx="6"
        fill="none" stroke="#000000" stroke-width="2.2" />

    <!-- ============ 6. Hex socket (round head, hex hole) ============ -->
    <polygon points="1034,150 1017,120.56 983,120.56 966,150 983,179.44 1017,179.44"
        fill="none" stroke="#000000" stroke-width="2.2" stroke-linejoin="miter" />

    <!-- ============ 7. Hex (plain hexagonal head) ============ -->

    <!-- ============ diameter dimension, repeated per head ============ -->
    <g stroke="#000000" stroke-width="1">
        <line x1="30" y1="222" x2="30" y2="252" />
        <line x1="170" y1="222" x2="170" y2="252" />
        <line x1="210" y1="222" x2="210" y2="252" />
        <line x1="350" y1="222" x2="350" y2="252" />
        <line x1="390" y1="222" x2="390" y2="252" />
        <line x1="530" y1="222" x2="530" y2="252" />
        <line x1="570" y1="222" x2="570" y2="252" />
        <line x1="710" y1="222" x2="710" y2="252" />
        <line x1="750" y1="222" x2="750" y2="252" />
        <line x1="890" y1="222" x2="890" y2="252" />
        <line x1="930" y1="222" x2="930" y2="252" />
        <line x1="1070" y1="222" x2="1070" y2="252" />
        <line x1="1110" y1="222" x2="1110" y2="252" />
        <line x1="1250" y1="222" x2="1250" y2="252" />
    </g>

    <g stroke="#000000" stroke-width="1.4"
        marker-start="url(#dimStart)" marker-end="url(#dimEnd)">
        <line x1="30" y1="246" x2="170" y2="246" />
        <line x1="210" y1="246" x2="350" y2="246" />
        <line x1="390" y1="246" x2="530" y2="246" />
        <line x1="570" y1="246" x2="710" y2="246" />
        <line x1="750" y1="246" x2="890" y2="246" />
        <line x1="930" y1="246" x2="1070" y2="246" />
        <line x1="1110" y1="246" x2="1250" y2="246" />
    </g>

    <!-- ============ labels ============ -->
    <g fill="#000000" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" font-style="italic" text-anchor="middle">
        <text x="100" y="238">D</text>
        <text x="280" y="238">D</text>
        <text x="460" y="238">D</text>
        <text x="640" y="238">D</text>
        <text x="820" y="238">D</text>
        <text x="1000" y="238">D</text>
        <text x="1180" y="238">D</text>
    </g>

    <g fill="#000000" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" text-anchor="middle">
        <text x="100" y="290">Phillips (PH)</text>
        <text x="280" y="290">Pozidriv (PZ)</text>
        <text x="460" y="290">Torx (TX)</text>
        <text x="640" y="290">Square (SQ)</text>
        <text x="820" y="290">Slotted (SL)</text>
        <text x="1000" y="290">Hex socket (HEX)</text>
        <text x="1180" y="290">Hex head (HH)</text>
    </g>
</svg>
